name: harvest

on:
  schedule:
    - cron: '10 */6 * * *'   # 每6小时：UTC 00:10/06:10/12:10/18:10（北京时间 08:10/14:10/20:10/02:10）
  workflow_dispatch:        # 支持手动触发

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install websockets

      - name: Harvest addresses
        run: python harvest.py

      - name: Commit data back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: harvest $(date -u +%Y-%m-%d)"
          git push
